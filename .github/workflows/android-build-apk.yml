name: Build Signed Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: 'on-failure'
          add-job-summary-as-pr-comment: 'never'

      - name: Prepare Local Environment and Permissions
        run: |
          # 1. Otorgar permisos de ejecucion al wrapper y generarlo si no existe
          if [ ! -f "gradlew" ]; then
            echo "gradlew no encontrado. Generando wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew || true

          # 2. Crear archivos locales vacios .env y .env.example para Secrets Gradle plugin
          touch .env && touch .env.example

      - name: Setup Keystore and Dynamic Key Alias Detection
        run: |
          set -euo pipefail
          KEYSTORE_FILE="my-upload-key.jks"
          DEFAULT_ALIAS="upload"
          STORE_PASS="${STORE_PASSWORD:-android}"
          KEY_PASS="${KEY_PASSWORD:-android}"

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Keystore $KEYSTORE_FILE no encontrado. Generando keystore de firma release automaticamente..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$DEFAULT_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=DownloadChunk, OU=Mobile, O=AIStudio, L=City, S=State, C=US"
          fi

          # Inspeccionar dinamicamente con keytool el alias del keystore existente
          DETECTED_ALIAS=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | awk -F': ' '{print $2}' | tr -d '\r' | xargs || true)

          if [ -z "$DETECTED_ALIAS" ]; then
            DETECTED_ALIAS="$DEFAULT_ALIAS"
          fi

          echo "Detected Key Alias: $DETECTED_ALIAS"

          # Copia redundante en la raiz ($GITHUB_WORKSPACE) y en app/
          cp -f "$KEYSTORE_FILE" "app/$KEYSTORE_FILE"

          # Exportar variables de entorno a GITHUB_ENV
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$DETECTED_ALIAS" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            -Dkotlin.compiler.execution.strategy=daemon \
            -Dksp.incremental=false \
            -Dksp.incremental.intermodule=false \
            --stacktrace

      - name: Verify Generated APK
        id: verify-apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: No se encontró ningún archivo APK en app/build/outputs/apk/release/"
            exit 1
          fi
          echo "APK generado exitosamente en: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          ls -lh "$APK_PATH"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
